services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: bloom
      POSTGRES_PASSWORD: bloom
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloom -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
