name: Phase 2 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom
          POSTGRES_DB: bloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloom -d bloom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bloom:bloom@127.0.0.1:5432/bloom_test?connection_limit=5
      TEST_DATABASE_URL: postgresql://bloom:bloom@127.0.0.1:5432/bloom_test?connection_limit=5
      APP_URL: http://127.0.0.1:3000
      DEMO_SEED: "true"
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run check
      - run: npm run build
